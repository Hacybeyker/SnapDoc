# Release — triggered by pushing a v* tag (e.g. v1.0.0)
# Builds the release APK and AAB (UNSIGNED) and creates a GitHub Release
# with the artifacts attached and auto-generated notes.
#
# ── To publish SIGNED builds ─────────────────────────────────────────────────
# 1. Add the repo secrets: KEYSTORE_BASE64, KEYSTORE_PASSWORD,
#    KEY_ALIAS and KEY_PASSWORD.
# 2. Decode the keystore before the build:
#      - run: echo "$KEYSTORE_BASE64" | base64 -d > keystore.jks
# 3. Configure signingConfigs in app/build.gradle.kts reading those
#    environment variables.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  android-release:
    name: Android — Release artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle (with cache)
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
        with:
          # Every CI build publishes a Build Scan: when a job fails here and not on a laptop, the
          # scan is what shows which task, which inputs and how long, without a rerun.
          build-scan-publish: true
          build-scan-terms-of-use-url: "https://gradle.com/help/legal-terms-of-use"
          build-scan-terms-of-use-agree: "yes"

      - name: Quality gate
        run: ./gradlew codeQuality

      - name: Unit tests
        run: ./gradlew test

      - name: Build release APK + AAB (unsigned)
        run: ./gradlew assembleRelease bundleRelease

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --generate-notes \
            app/build/outputs/apk/release/*.apk \
            app/build/outputs/bundle/release/*.aab
