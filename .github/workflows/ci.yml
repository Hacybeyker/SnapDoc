# CI — Quality + Android Build/Tests
# Generic: uses the app module's aggregated tasks (codeQuality, formatAndAnalyze)
# and doesn't depend on the project name or package.
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Job strategy:
#   quality ──> android
# `quality` acts as a gate: it's the fastest, cheapest job. If it fails,
# no compute is spent on the build/tests.
jobs:
  quality:
    name: Code Quality (ktlint + detekt + Lint)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle (with cache)
        uses: gradle/actions/setup-gradle@90ddb51e90a5fd9ba75f40cf85156b7b41bf76a3 # v6
        with:
          # Every CI build publishes a Build Scan: when a job fails here and not on a laptop, the
          # scan is what shows which task, which inputs and how long, without a rerun.
          build-scan-publish: true
          build-scan-terms-of-use-url: "https://gradle.com/help/legal-terms-of-use"
          build-scan-terms-of-use-agree: "yes"

      - name: Run quality checks
        run: ./gradlew codeQuality

      - name: Upload quality reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: quality-reports
          path: |
            **/build/reports/ktlint/
            **/build/reports/detekt/
            **/build/reports/lint-results-*.html
          if-no-files-found: ignore

  android:
    name: Android — Build, Test & Analysis
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 30
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Full history: SonarCloud needs it for per-line blame and its new-code period.
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle (with cache)
        uses: gradle/actions/setup-gradle@90ddb51e90a5fd9ba75f40cf85156b7b41bf76a3 # v6
        with:
          # Every CI build publishes a Build Scan: when a job fails here and not on a laptop, the
          # scan is what shows which task, which inputs and how long, without a rerun.
          build-scan-publish: true
          build-scan-terms-of-use-url: "https://gradle.com/help/legal-terms-of-use"
          build-scan-terms-of-use-agree: "yes"

      - name: Unit tests, coverage gate and screenshot gate
        run: ./gradlew test koverVerifyDebug koverHtmlReportDebug verifyRoborazziDebug

      - name: Build debug APK
        run: ./gradlew assembleDebug

      # Skipped until SONAR_TOKEN exists, so a fork or a token-less checkout still gets a green CI.
      - name: SonarCloud analysis
        if: ${{ env.SONAR_TOKEN != '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew sonar

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload test, coverage and screenshot reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: android-test-reports
          path: |
            **/build/reports/tests/
            **/build/reports/kover/
            **/build/reports/roborazzi/
            app/build/outputs/roborazzi/
          if-no-files-found: ignore
          retention-days: 7
