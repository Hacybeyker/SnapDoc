# CI — Calidad + Build/Tests Android
# Genérico: usa las tareas agregadas del módulo app (codeQuality, formatAndAnalyze)
# y no depende del nombre del proyecto ni del package.
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Estrategia de jobs:
#   quality ──> android
# `quality` actúa como gate: es el job más rápido y barato. Si falla,
# no se gasta cómputo en el build/tests.
jobs:
  quality:
    name: Code Quality (ktlint + detekt + Lint)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle (con cache)
        uses: gradle/actions/setup-gradle@v6

      - name: Run quality checks
        run: ./gradlew codeQuality

      - name: Upload quality reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: quality-reports
          path: |
            **/build/reports/ktlint/
            **/build/reports/detekt/
            **/build/reports/lint-results-*.html
          if-no-files-found: ignore

  android:
    name: Android — Build & Test
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle (con cache)
        uses: gradle/actions/setup-gradle@v6

      - name: Unit tests (JVM)
        run: ./gradlew test

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: android-test-reports
          path: '**/build/reports/tests/'
          if-no-files-found: ignore
