// Classes the Compose compiler must treat as stable (skippability of composables).
// These java.time types are immutable, so they are safe to mark stable even though
// they carry no @Stable annotation we could add ourselves.
java.time.LocalDate
java.time.YearMonth

// ViewModels are always flagged unstable (mutable `var` state, Flow-backed fields), but
// their identity never changes across recomposition and any state that should trigger
// recomposition already flows through State/StateFlow, which Compose tracks correctly.
// Listed here once, at the base class, so it covers every ViewModel subtype project-wide
// instead of adding one line per ViewModel (verified: this config matches subclasses).
androidx.lifecycle.ViewModel
