# Detekt configuration — applied ON TOP of the default ruleset
# (buildUponDefaultConfig = true in the module's build.gradle).
#
# To regenerate the full default file:
#   ./gradlew detektGenerateConfig
#
# Validation is disabled to tolerate rule-name differences
# between detekt versions (1.23.x vs 2.0.x).
config:
  validation: false

# --- Naming: Kotlin standards + Jetpack Compose support --------------------
# @Composable and @Preview functions use PascalCase (Compose standard),
# which clashes with FunctionNaming. Those annotations are ignored instead
# of disabling the rule, to keep validating the rest of the functions.
naming:
  FunctionNaming:
    ignoreAnnotated: ['Composable', 'Preview']
  TopLevelPropertyNaming:
    # Theme/design constants (val LightColors, etc.) in Compose.
    ignoreAnnotated: ['Composable']

complexity:
  LongMethod:
    threshold: 80
  LongParameterList:
    functionThreshold: 8
    constructorThreshold: 8
    ignoreAnnotated: ['Composable']
  TooManyFunctions:
    thresholdInFiles: 30
    thresholdInClasses: 30

# --- Style: FORMAT is governed by ktlint (single source of truth) ----------
# To avoid reporting the same thing twice, detekt disables the rules that
# ktlint already covers (line length, wildcard imports, final newline...).
style:
  MagicNumber:
    active: false
  MaxLineLength:
    active: false
  WildcardImport:
    active: false
  NewLineAtEndOfFile:
    active: false
